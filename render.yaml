# Render Blueprint — God's Eye View server + geofence alert service
# ==================================================================
# Two small services in Singapore, next to the ShelfLifePro India host.
#
#   gev-map             the GEV app and feed server (SACHET, JTWC, heat stress,
#                       TomTom traffic and the rest). Public, but behind the
#                       login gate: every request needs a session from
#                       /gate/login or the gate password as a bearer token, so
#                       the internet cannot spend the TomTom quota. Set
#                       GEV_GATE_PASSWORD (one shared password) and/or
#                       GEV_GATE_USERS ("name:pw,name2:pw") in the dashboard.
#   gev-alert-service   the geofence alert service + corridor monitor. Public,
#                       because products register sites here and corridor
#                       reports are meant to be shared. Everything except
#                       reads of reports and /health needs ADMIN_TOKEN.
#
# Set TOMTOM_API_KEY and GEV_GATE_PASSWORD on both services in the Render
# dashboard (sync: false keeps them out of this file). The alert service
# reaches the GEV server over the private network at http://gev-map:10000 and
# opens the gate with the same password. For the emailed weekly corridor
# report set SMTP_USER, SMTP_PASS (a Gmail app password works) and REPORT_TO.

services:
  - type: web
    name: gev-map
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx vite preview --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: TOMTOM_API_KEY
        sync: false
      # Browser-side keys are baked in at build time, so a change needs a redeploy.
      # CESIUM_ION_TOKEN adds world terrain and Google 3D buildings via ion.
      - key: CESIUM_ION_TOKEN
        sync: false
      # Open on Chennai with Tamil Nadu's layers: heat, fires, SACHET alerts,
      # traffic, water hazards, cyclones (NHC + JTWC). A share-link hash.
      - key: VITE_GEV_HOME_VIEW
        value: v=2&lat=12.81&lon=80.22&alt=38000&heading=0&pitch=-60&roll=0&style=normal&sc=1&scf=11&ko=1&l=5.w.2.t.4.y.3
      - key: FIRMS_MAP_KEY
        sync: false
      - key: AISSTREAM_API_KEY
        sync: false
      # Fail closed: until a password is set below, every request gets 503.
      - key: GEV_GATE_REQUIRED
        value: "1"
      - key: GEV_GATE_PASSWORD
        sync: false
      - key: GEV_GATE_USERS
        sync: false
      - key: GEV_GATE_SECRET
        generateValue: true
      - key: OPENSKY_AUTH_MODE
        value: anon

  - type: web
    name: gev-alert-service
    runtime: node
    region: singapore
    plan: starter
    rootDir: alert-service
    # No dependencies and no lockfile, so there is nothing to install.
    buildCommand: echo "nothing to build"
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: GEV_BASE_URL
        value: http://gev-map:10000
      - key: GEV_GATE_PASSWORD
        sync: false
      - key: REPORT_BASE_URL
        value: https://gev-alert-service.onrender.com
      # Section travel times for eight road corridors and Chennai incidents,
      # both every 15 minutes: about 870 TomTom calls a day of the 2,500 free.
      - key: CORRIDOR_MINUTES
        value: "15"
      - key: INCIDENT_MINUTES
        value: "15"
      # Hourly rainfall per road from Open-Meteo (no key).
      - key: RAIN_MINUTES
        value: "60"
      # Leave unset until TomTom confirms its storage and sharing terms:
      # RAW_RETENTION_DAYS (delete raw readings after N days, roll-ups kept)
      # and EXPORT_PUBLIC=1 (open /export/slots.csv without the admin token).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: REPORT_TO
        sync: false
      - key: POLL_MINUTES
        value: "10"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: TOMTOM_API_KEY
        sync: false
    disk:
      name: gev-alerts-data
      mountPath: /var/data
      sizeGB: 1
